name: Deploy Phoenix-Web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle with GitHub Pages base-href
        run: npx ng build --configuration production --base-href /Phoenix-Web/

      - name: SPA Route Fallback & Jekyll bypass
        run: |
          cp dist/phoenix-web/browser/index.html dist/phoenix-web/browser/404.html
          touch dist/phoenix-web/browser/.nojekyll

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist/phoenix-web/browser
